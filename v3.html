<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Franez v3.0.6</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
#app-frame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app-frame" src="index.html" title="Franez"></iframe>
<script>
(function(){
  var frame=document.getElementById('app-frame');

  function instalarV3(){
    var w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!d.body)return;

    /* V3: el popup deja de existir como función visible, pero el nodo se conserva
       para que los listeners antiguos no provoquen errores al ejecutarse. */
    w.initPopupInicio=function(){};
    var popup=d.getElementById('popup-inicio');
    if(popup){
      popup.style.setProperty('display','none','important');
      popup.setAttribute('aria-hidden','true');
    }

    /* V3: versión */
    d.title='Franez v3.0.6';
    var navTitle=d.getElementById('nav-title');
    if(navTitle)navTitle.textContent='⚡ Franez v3.0.6';

    /* Evitar duplicados */
    if(d.getElementById('nav-avisos-v3')){
      actualizarAvisos();
      return;
    }

    var nav=d.getElementById('nav');
    if(!nav)return;

    /* Nueva pestaña Avisos */
    var btn=d.createElement('button');
    btn.id='nav-avisos-v3';
    btn.className='nav-btn';
    btn.innerHTML='🔔 Avisos <span class="nav-badge hidden" id="avisos-badge-v3">0</span>';
    btn.onclick=function(){
      w.showPanel('avisos-v3',btn);
      renderAvisos();
    };

    var ajustes=d.querySelector('.nav-btn[onclick*="showPanel(\'ajustes\'"]');
    if(ajustes)nav.insertBefore(btn,ajustes);
    else nav.appendChild(btn);

    /* Panel de avisos, completamente desplazable */
    var panel=d.createElement('div');
    panel.className='panel';
    panel.id='panel-avisos-v3';
    panel.innerHTML=
      '<div class="card" style="max-width:1100px;margin:0 auto">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px">'+
          '<div>'+
            '<div class="card-title" style="margin:0">🔔 Avisos</div>'+
            '<div style="font-size:13px;color:var(--text3);margin-top:5px">Todo lo que requiere tu atención, sin ventanas emergentes.</div>'+
          '</div>'+
          '<button class="btn btn-ghost btn-sm" id="avisos-refresh-v3">Actualizar</button>'+
        '</div>'+
        '<div id="avisos-content-v3"></div>'+
      '</div>';
    d.body.appendChild(panel);

    var style=d.createElement('style');
    style.id='estilos-avisos-v3';
    style.textContent=
      '#panel-avisos-v3{overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding-bottom:80px}'+
      '#panel-avisos-v3 .card{min-height:fit-content}'+
      '.aviso-v3{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--slate1,#111827)}'+
      '.aviso-v3.urgente{border-left:4px solid #ef4444}'+
      '.aviso-v3.proximo{border-left:4px solid #f59e0b}'+
      '.aviso-v3.normal{border-left:4px solid #22c55e}'+
      '.aviso-v3-title{font-weight:700;font-size:14px;margin-bottom:5px}'+
      '.aviso-v3-meta{font-size:12px;color:var(--text3)}'+
      '.aviso-v3-empty{padding:28px 16px;text-align:center;color:var(--text3);border:1px dashed var(--border);border-radius:12px}'+
      '#popup-inicio{display:none!important}';
    d.head.appendChild(style);

    function getContratos(){
      if(typeof w.getContratosProximos==='function')return w.getContratosProximos();
      var dias=(w.state&&w.state.config&&w.state.config.diasContrato)||21;
      return (w.state&&Array.isArray(w.state.clientes)?w.state.clientes:[]).filter(function(c){
        if(!c.contrato||typeof w.diasParaVencer!=='function')return false;
        var x=w.diasParaVencer(c.contrato);
        return x>=0&&x<=dias;
      }).sort(function(a,b){
        return w.diasParaVencer(a.contrato)-w.diasParaVencer(b.contrato);
      });
    }

    function renderAvisos(){
      var box=d.getElementById('avisos-content-v3');
      if(!box)return;

      var contratos=getContratos();

      if(!contratos.length){
        box.innerHTML='<div class="aviso-v3-empty">✓ No tienes avisos pendientes de contratos.</div>';
        actualizarAvisos();
        return;
      }

      box.innerHTML=contratos.map(function(c){
        var dias=typeof w.diasParaVencer==='function'?w.diasParaVencer(c.contrato):0;
        var clase=dias<=7?'urgente':(dias<=14?'proximo':'normal');
        var texto=dias===0?'Vence hoy':(dias===1?'Vence mañana':'Vence en '+dias+' días');
        var fecha=typeof w.formatContratoDisplay==='function'?w.formatContratoDisplay(c.contrato):c.contrato;
        var nombre=typeof w.escH==='function'?w.escH(c.nombreCompleto):c.nombreCompleto||'Cliente';

        return '<div class="aviso-v3 '+clase+'">'+
          '<div class="aviso-v3-title">📋 '+nombre+'</div>'+
          '<div class="aviso-v3-meta"><strong>'+texto+'</strong> · Fecha de contrato: '+fecha+'</div>'+
        '</div>';
      }).join('');

      actualizarAvisos();
    }

    function actualizarAvisos(){
      var badge=d.getElementById('avisos-badge-v3');
      if(!badge)return;

      var contratos=[];
      if(typeof w.getContratosProximos==='function'){
        contratos=w.getContratosProximos();
      }else if(w.state&&Array.isArray(w.state.clientes)&&typeof w.diasParaVencer==='function'){
        var dias=(w.state.config&&w.state.config.diasContrato)||21;
        contratos=w.state.clientes.filter(function(c){
          if(!c.contrato)return false;
          var x=w.diasParaVencer(c.contrato);
          return x>=0&&x<=dias;
        });
      }

      var n=contratos.length;
      badge.textContent=n;
      badge.classList.toggle('hidden',n===0);
    }

    var refresh=d.getElementById('avisos-refresh-v3');
    if(refresh)refresh.onclick=renderAvisos;

    /* Reflejar v3 también en Acerca de */
    var aboutVersion=d.getElementById('about-version');
    if(aboutVersion)aboutVersion.textContent='v3.0.6';

    var aboutChange=d.getElementById('about-changelog');
    if(aboutChange){
      var item=d.createElement('div');
      item.className='changelog-item';
      item.innerHTML='<span class="changelog-version">v3.0.6</span><span class="changelog-desc">Nueva pestaña Avisos. Se elimina el popup de inicio. Inicio de la etapa 3: el desarrollo técnico de Franez pasa a estar bajo el mando de ChatGPT.</span>';
      aboutChange.insertBefore(item,aboutChange.firstChild);
    }

    w.renderAvisosV3=renderAvisos;
    actualizarAvisos();
    instalarBotonBackup();
  }


  /* V3.0.6 — COPIA DE SEGURIDAD LOCAL OBLIGATORIA
     La PWA pide una sola vez acceso a Documents/Json y crea BACKUPS_FRANEZ.
     Después, al abrir Franez cada día, guarda automáticamente un JSON completo.
  */
  var BACKUP_DB='franez-backup-db';
  var BACKUP_STORE='handles';
  var BACKUP_KEY='backupDir';
  var BACKUP_FOLDER='BACKUPS_FRANEZ';
  var backupOverlay=null;

  function abrirBackupDB(){
    return new Promise(function(resolve,reject){
      if(!window.indexedDB){reject(new Error('IndexedDB no está disponible'));return;}
      var req=indexedDB.open(BACKUP_DB,1);
      req.onupgradeneeded=function(){
        var db=req.result;
        if(!db.objectStoreNames.contains(BACKUP_STORE)) db.createObjectStore(BACKUP_STORE);
      };
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(){reject(req.error||new Error('No se pudo abrir el almacenamiento de configuración'));};
    });
  }

  async function guardarHandleBackup(handle){
    var db=await abrirBackupDB();
    return new Promise(function(resolve,reject){
      var tx=db.transaction(BACKUP_STORE,'readwrite');
      tx.objectStore(BACKUP_STORE).put(handle,BACKUP_KEY);
      tx.oncomplete=function(){db.close();resolve();};
      tx.onerror=function(){db.close();reject(tx.error);};
    });
  }

  async function leerHandleBackup(){
    var db=await abrirBackupDB();
    return new Promise(function(resolve,reject){
      var tx=db.transaction(BACKUP_STORE,'readonly');
      var req=tx.objectStore(BACKUP_STORE).get(BACKUP_KEY);
      req.onsuccess=function(){db.close();resolve(req.result||null);};
      req.onerror=function(){db.close();reject(req.error);};
    });
  }

  async function comprobarPermisoBackup(handle){
    if(!handle)return false;
    try{
      if(typeof handle.queryPermission==='function'){
        var estado=await handle.queryPermission({mode:'readwrite'});
        if(estado==='granted')return true;
        return false;
      }
      return true;
    }catch(e){return false;}
  }

  function crearOverlayBackup(){
    if(backupOverlay)return backupOverlay;
    var ov=document.createElement('div');
    ov.id='franez-backup-overlay';
    ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.96);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:Arial,sans-serif;color:#fff';
    ov.innerHTML=
      '<div style="width:min(520px,100%);background:#111827;border:1px solid #334155;border-radius:18px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.45)">'+
        '<div style="font-size:30px;text-align:center;margin-bottom:8px">🛡️</div>'+
        '<div id="franez-backup-title" style="font-size:21px;font-weight:800;text-align:center;margin-bottom:10px">Copia de seguridad obligatoria</div>'+
        '<div id="franez-backup-text" style="font-size:14px;line-height:1.6;color:#cbd5e1;margin-bottom:18px;text-align:center">'+
          'Para proteger los datos de Franez, la aplicación necesita una carpeta de respaldo en el tablet.<br><br>'+
          '<strong style="color:#fff">Selecciona:</strong> Documents → Json.<br>'+
          'Franez creará dentro la carpeta <strong style="color:#93c5fd">BACKUPS_FRANEZ</strong> automáticamente.'+
        '</div>'+
        '<div id="franez-backup-status" style="display:none;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px"></div>'+
        '<button id="franez-backup-action" style="width:100%;min-height:50px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:800;cursor:pointer">📁 Seleccionar carpeta Json</button>'+
        '<div style="font-size:11px;color:#64748b;text-align:center;margin-top:12px">La selección se hace una sola vez. Después el backup diario será automático.</div>'+
      '</div>';
    document.body.appendChild(ov);
    backupOverlay=ov;
    ov.querySelector('#franez-backup-action').onclick=configurarCarpetaBackup;
    return ov;
  }

  function ocultarOverlayBackup(){
    if(backupOverlay){
      backupOverlay.remove();
      backupOverlay=null;
    }
  }

  function mostrarEstadoBackup(msg,ok){
    var ov=crearOverlayBackup();
    var box=ov.querySelector('#franez-backup-status');
    box.style.display='block';
    box.style.background=ok?'rgba(22,101,52,.25)':'rgba(127,29,29,.3)';
    box.style.border='1px solid '+(ok?'#22c55e':'#ef4444');
    box.style.color=ok?'#bbf7d0':'#fecaca';
    box.textContent=msg;
  }

  function backupFechaISO(){
    var d=new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }

  function construirDatosBackup(){
    var w=frame.contentWindow;
    var st=w.state||{};
    return {
      backupVersion:'1',
      appVersion:'3.0.6',
      fechaBackup:new Date().toISOString(),
      clientes:Array.isArray(st.clientes)?st.clientes:[],
      productos:Array.isArray(st.productos)?st.productos:[],
      ofertas:Array.isArray(st.ofertas)?st.ofertas:[],
      pedidos:Array.isArray(st.pedidos)?st.pedidos:[],
      historial:Array.isArray(st.historial)?st.historial:[],
      stock:st.stock||{},
      delegado:st.delegado||'',
      campanas:Array.isArray(st.campanas)?st.campanas:[],
      config:st.config||{},
      acumuladoMensual:st.acumuladoMensual||{},
      rutaDia:st.rutaDia||{fecha:'',clientes:[]},
      datosLocales:{
        planSemana:localStorage.getItem('planSemana')||'',
        franez_zonas:localStorage.getItem('franez_zonas')||'',
        franez_ts:localStorage.getItem('franez_ts')||''
      }
    };
  }

  async function escribirBackupAutomatico(dirHandle){
    var nombre='backup_'+backupFechaISO()+'.json';
    var fileHandle;
    try{
      fileHandle=await dirHandle.getFileHandle(nombre,{create:false});
      return {creado:false,nombre:nombre};
    }catch(e){
      if(e.name!=='NotFoundError')throw e;
    }

    fileHandle=await dirHandle.getFileHandle(nombre,{create:true});
    var writable=await fileHandle.createWritable();
    try{
      await writable.write(JSON.stringify(construirDatosBackup(),null,2));
      await writable.close();
    }catch(e){
      try{await writable.abort();}catch(_){}
      throw e;
    }
    return {creado:true,nombre:nombre};
  }

  async function obtenerCarpetaBackup(){
    var handle=await leerHandleBackup();
    if(handle && await comprobarPermisoBackup(handle))return handle;
    return null;
  }

  async function esperarDatosCRM(){
    var w=frame.contentWindow;
    for(var i=0;i<40;i++){
      try{
        if(w.state && Array.isArray(w.state.clientes) && w.state.clientes.length>0)return true;
        if(w._fbGet&&w._fbRef&&w._fbDb){
          var snap=await w._fbGet(w._fbRef(w._fbDb,'franez'));
          if(snap&&snap.exists()){
            var remote=snap.val()||{};
            if(Array.isArray(remote.clientes)&&remote.clientes.length>0){
              for(var j=0;j<20;j++){
                if(w.state&&Array.isArray(w.state.clientes)&&w.state.clientes.length>0)return true;
                await new Promise(function(r){setTimeout(r,250);});
              }
              return true;
            }
          }
          return true;
        }
      }catch(e){}
      await new Promise(function(r){setTimeout(r,250);});
    }
    return !!(w.state&&Array.isArray(w.state.clientes));
  }

  async function realizarBackupDeHoy(){
    var dir=await obtenerCarpetaBackup();
    if(!dir)return {ok:false,configurar:true};
    var okPermiso=await comprobarPermisoBackup(dir);
    if(!okPermiso)return {ok:false,configurar:true};
    await esperarDatosCRM();
    var resultado=await escribirBackupAutomatico(dir);
    return {ok:true,creado:resultado.creado,nombre:resultado.nombre};
  }

  async function ejecutarBackupInicio(){
    if(!window.showDirectoryPicker){
      crearOverlayBackup();
      var ov=backupOverlay;
      ov.querySelector('#franez-backup-title').textContent='Navegador no compatible';
      ov.querySelector('#franez-backup-text').innerHTML=
        'Esta función necesita Chrome/Chromium actualizado para poder escribir en una carpeta del tablet.<br><br>'+
        '<strong style="color:#fca5a5">No voy a fingir que el backup automático está funcionando si el navegador no puede hacerlo.</strong>';
      ov.querySelector('#franez-backup-action').style.display='none';
      return;
    }

    try{
      var dir=await obtenerCarpetaBackup();
      if(!dir){
        crearOverlayBackup();
        return;
      }

      var resultado=await realizarBackupDeHoy();
      if(resultado.ok){
        ocultarOverlayBackup();
        var w=frame.contentWindow;
        if(w.toast){
          w.toast(resultado.creado?'🛡️ Copia de seguridad de hoy realizada ✓':'🛡️ La copia de seguridad de hoy ya existía ✓','ok');
        }
        return;
      }
      crearOverlayBackup();
    }catch(e){
      crearOverlayBackup();
      var title=backupOverlay.querySelector('#franez-backup-title');
      var text=backupOverlay.querySelector('#franez-backup-text');
      var action=backupOverlay.querySelector('#franez-backup-action');
      title.textContent='No se pudo completar el respaldo';
      text.innerHTML='No voy a dejar el CRM funcionando como si la copia estuviera hecha.<br><br>'+
        '<span style="color:#fca5a5">'+String(e&&e.message?e.message:e)+'</span><br><br>'+
        'Pulsa el botón para volver a seleccionar <strong>Documents → Json</strong>.';
      action.textContent='📁 Volver a seleccionar Json';
    }
  }

  async function configurarCarpetaBackup(){
    if(!window.showDirectoryPicker)return;
    var ov=crearOverlayBackup();
    var action=ov.querySelector('#franez-backup-action');
    action.disabled=true;
    action.style.opacity='.6';
    try{
      var dir=await window.showDirectoryPicker({
        id:'franez-backups',
        mode:'readwrite',
        startIn:'documents'
      });
      if(!dir||dir.name.toLowerCase()!=='json'){
        throw new Error('Debes seleccionar exactamente la carpeta Json dentro de Documents.');
      }
      var backupDir=await dir.getDirectoryHandle(BACKUP_FOLDER,{create:true});
      await guardarHandleBackup(backupDir);
      action.disabled=false;
      action.style.opacity='1';
      ov.querySelector('#franez-backup-title').textContent='Carpeta configurada ✓';
      ov.querySelector('#franez-backup-text').innerHTML=
        'Se ha creado/seleccionado:<br><br>'+
        '<strong style="color:#93c5fd">Documents → Json → BACKUPS_FRANEZ</strong><br><br>'+
        'Ahora voy a realizar la copia de seguridad de hoy.';
      ov.querySelector('#franez-backup-status').style.display='none';
      var resultado=await realizarBackupDeHoy();
      if(!resultado.ok)throw new Error('No se pudo escribir la copia de seguridad.');
      ocultarOverlayBackup();
      var w=frame.contentWindow;
      if(w.toast)w.toast('🛡️ Copia de seguridad de hoy realizada ✓','ok');
    }catch(e){
      action.disabled=false;
      action.style.opacity='1';
      if(e&&e.name==='AbortError'){
        ov.querySelector('#franez-backup-title').textContent='La copia es obligatoria';
        mostrarEstadoBackup('No se ha seleccionado la carpeta. Para entrar en Franez hay que configurar el respaldo.',false);
      }else{
        mostrarEstadoBackup(String(e&&e.message?e.message:e),false);
      }
    }
  }

  async function forzarBackupManual(){
    try{
      var resultado=await realizarBackupDeHoy();
      if(resultado.ok){
        var w=frame.contentWindow;
        if(w.toast)w.toast(resultado.creado?'🛡️ Backup manual creado ✓':'🛡️ El backup de hoy ya existe ✓','ok');
      }else{
        await configurarCarpetaBackup();
      }
    }catch(e){
      crearOverlayBackup();
      mostrarEstadoBackup(String(e&&e.message?e.message:e),false);
    }
  }

  function instalarBotonBackup(){
    var w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    if(d.getElementById('nav-backup-v306'))return;
    var nav=d.getElementById('nav');
    if(!nav)return;
    var b=d.createElement('button');
    b.id='nav-backup-v306';
    b.className='nav-btn';
    b.innerHTML='🛡️ Backup';
    b.title='Copia de seguridad';
    b.onclick=function(){forzarBackupManual();};
    var avisos=d.getElementById('nav-avisos-v3');
    if(avisos&&avisos.nextSibling)nav.insertBefore(b,avisos.nextSibling);
    else if(avisos)nav.appendChild(b);
    else nav.appendChild(b);
  }

  function arrancar(){
    setTimeout(function(){
      instalarV3();
      instalarBotonBackup();
      setTimeout(ejecutarBackupInicio,900);
    },50);
  }

  frame.addEventListener('load',arrancar);
})();
</script>
</body>
</html>
