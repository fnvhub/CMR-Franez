<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>Franez v3.0.9</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a}
#app-frame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app-frame" src="index.html" title="Franez"></iframe>
<script>
(function(){
  var frame=document.getElementById('app-frame');

  function instalarV3(){
    var w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!d.body)return;

    /* V3: el popup deja de existir como función visible, pero el nodo se conserva
       para que los listeners antiguos no provoquen errores al ejecutarse. */
    w.initPopupInicio=function(){};
    var popup=d.getElementById('popup-inicio');
    if(popup){
      popup.style.setProperty('display','none','important');
      popup.setAttribute('aria-hidden','true');
    }

    /* V3: versión */
    d.title='Franez v3.0.9';
    var navTitle=d.getElementById('nav-title');
    if(navTitle)navTitle.textContent='⚡ Franez v3.0.9';

    /* Evitar duplicados */
    if(d.getElementById('nav-avisos-v3')){
      actualizarAvisos();
      return;
    }

    var nav=d.getElementById('nav');
    if(!nav)return;

    /* Nueva pestaña Avisos */
    var btn=d.createElement('button');
    btn.id='nav-avisos-v3';
    btn.className='nav-btn';
    btn.innerHTML='🔔 Avisos <span class="nav-badge hidden" id="avisos-badge-v3">0</span>';
    btn.onclick=function(){
      w.showPanel('avisos-v3',btn);
      renderAvisos();
    };

    var ajustes=d.querySelector('.nav-btn[onclick*="showPanel(\'ajustes\'"]');
    if(ajustes)nav.insertBefore(btn,ajustes);
    else nav.appendChild(btn);

    /* Panel de avisos, completamente desplazable */
    var panel=d.createElement('div');
    panel.className='panel';
    panel.id='panel-avisos-v3';
    panel.innerHTML=
      '<div class="card" style="max-width:1100px;margin:0 auto">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px">'+
          '<div>'+
            '<div class="card-title" style="margin:0">🔔 Avisos</div>'+
            '<div style="font-size:13px;color:var(--text3);margin-top:5px">Todo lo que requiere tu atención, sin ventanas emergentes.</div>'+
          '</div>'+
          '<button class="btn btn-ghost btn-sm" id="avisos-refresh-v3">Actualizar</button>'+
        '</div>'+
        '<div id="avisos-content-v3"></div>'+
      '</div>';
    d.body.appendChild(panel);

    var style=d.createElement('style');
    style.id='estilos-avisos-v3';
    style.textContent=
      '#panel-avisos-v3{overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding-bottom:80px}'+
      '#panel-avisos-v3 .card{min-height:fit-content}'+
      '.aviso-v3{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card);color:var(--text);box-shadow:var(--shadow)}'+
      '.aviso-v3.urgente{border-left:4px solid #ef4444}'+
      '.aviso-v3.proximo{border-left:4px solid #f59e0b}'+
      '.aviso-v3.normal{border-left:4px solid #22c55e}'+
      '.aviso-v3-title{font-weight:700;font-size:14px;margin-bottom:5px}'+
      '.aviso-v3-meta{font-size:12px;color:var(--text3)}'+
      '.aviso-v3-empty{padding:28px 16px;text-align:center;color:var(--text3);border:1px dashed var(--border);border-radius:12px}'+
      '#popup-inicio{display:none!important}';
    d.head.appendChild(style);

    function getContratos(){
      if(typeof w.getContratosProximos==='function')return w.getContratosProximos();
      var dias=(w.state&&w.state.config&&w.state.config.diasContrato)||21;
      return (w.state&&Array.isArray(w.state.clientes)?w.state.clientes:[]).filter(function(c){
        if(!c.contrato||typeof w.diasParaVencer!=='function')return false;
        var x=w.diasParaVencer(c.contrato);
        return x>=0&&x<=dias;
      }).sort(function(a,b){
        return w.diasParaVencer(a.contrato)-w.diasParaVencer(b.contrato);
      });
    }

    function renderAvisos(){
      var box=d.getElementById('avisos-content-v3');
      if(!box)return;

      var contratos=getContratos();

      if(!contratos.length){
        box.innerHTML='<div class="aviso-v3-empty">✓ No tienes avisos pendientes de contratos.</div>';
        actualizarAvisos();
        return;
      }

      box.innerHTML=contratos.map(function(c){
        var dias=typeof w.diasParaVencer==='function'?w.diasParaVencer(c.contrato):0;
        var clase=dias<=7?'urgente':(dias<=14?'proximo':'normal');
        var texto=dias===0?'Vence hoy':(dias===1?'Vence mañana':'Vence en '+dias+' días');
        var fecha=typeof w.formatContratoDisplay==='function'?w.formatContratoDisplay(c.contrato):c.contrato;
        var nombre=typeof w.escH==='function'?w.escH(c.nombreCompleto):c.nombreCompleto||'Cliente';

        return '<div class="aviso-v3 '+clase+'">'+
          '<div class="aviso-v3-title">📋 '+nombre+'</div>'+
          '<div class="aviso-v3-meta"><strong>'+texto+'</strong> · Fecha de contrato: '+fecha+'</div>'+
        '</div>';
      }).join('');

      actualizarAvisos();
    }

    function actualizarAvisos(){
      var badge=d.getElementById('avisos-badge-v3');
      if(!badge)return;

      var contratos=[];
      if(typeof w.getContratosProximos==='function'){
        contratos=w.getContratosProximos();
      }else if(w.state&&Array.isArray(w.state.clientes)&&typeof w.diasParaVencer==='function'){
        var dias=(w.state.config&&w.state.config.diasContrato)||21;
        contratos=w.state.clientes.filter(function(c){
          if(!c.contrato)return false;
          var x=w.diasParaVencer(c.contrato);
          return x>=0&&x<=dias;
        });
      }

      var n=contratos.length;
      badge.textContent=n;
      badge.classList.toggle('hidden',n===0);
    }

    var refresh=d.getElementById('avisos-refresh-v3');
    if(refresh)refresh.onclick=renderAvisos;

    /* Reflejar v3 también en Acerca de */
    var aboutVersion=d.getElementById('about-version');
    if(aboutVersion)aboutVersion.textContent='v3.0.9';

    var aboutChange=d.getElementById('about-changelog');
    if(aboutChange){
      var item=d.createElement('div');
      item.className='changelog-item';
      item.innerHTML='<span class="changelog-version">v3.0.9</span><span class="changelog-desc">Nueva pestaña Avisos. Se elimina el popup de inicio. Inicio de la etapa 3: el desarrollo técnico de Franez pasa a estar bajo el mando de ChatGPT.</span>';
      aboutChange.insertBefore(item,aboutChange.firstChild);
    }

    w.renderAvisosV3=renderAvisos;
    actualizarAvisos();
  }


  /* V3.0.8 — BACKUP AUTOMÁTICO SIMPLE
     Sin permisos ni carpetas especiales: el JSON se descarga en la carpeta
     de descargas configurada por el navegador. El usuario conserva el control:
     puede desactivar el automático en Ajustes y siempre puede usar el botón Backup.
  */
  var BACKUP_AUTO_KEY='franez_backup_automatico';
  var BACKUP_DAY_KEY='franez_backup_ultimo_dia';

  function backupAutomaticoActivo(){
    return localStorage.getItem(BACKUP_AUTO_KEY)!=='off';
  }

  function construirDatosBackup(){
    var w=frame.contentWindow;
    var st=w.state||{};
    return {
      backupVersion:'1',
      appVersion:'3.0.9',
      fechaBackup:new Date().toISOString(),
      clientes:Array.isArray(st.clientes)?st.clientes:[],
      productos:Array.isArray(st.productos)?st.productos:[],
      ofertas:Array.isArray(st.ofertas)?st.ofertas:[],
      pedidos:Array.isArray(st.pedidos)?st.pedidos:[],
      historial:Array.isArray(st.historial)?st.historial:[],
      stock:st.stock||{},
      delegado:st.delegado||'',
      campanas:Array.isArray(st.campanas)?st.campanas:[],
      config:st.config||{},
      acumuladoMensual:st.acumuladoMensual||{},
      rutaDia:st.rutaDia||{fecha:'',clientes:[]},
      datosLocales:{
        planSemana:localStorage.getItem('planSemana')||'',
        franez_zonas:localStorage.getItem('franez_zonas')||'',
        franez_ts:localStorage.getItem('franez_ts')||''
      }
    };
  }

  function backupFechaISO(){
    var d=new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }

  async function esperarDatosCRM(){
    var w=frame.contentWindow;
    for(var i=0;i<40;i++){
      try{
        if(w.state && Array.isArray(w.state.clientes) && w.state.clientes.length>0)return true;
        if(w._fbGet&&w._fbRef&&w._fbDb){
          var snap=await w._fbGet(w._fbRef(w._fbDb,'franez'));
          if(snap&&snap.exists()){
            var remote=snap.val()||{};
            if(Array.isArray(remote.clientes)&&remote.clientes.length>0){
              for(var j=0;j<20;j++){
                if(w.state&&Array.isArray(w.state.clientes)&&w.state.clientes.length>0)return true;
                await new Promise(function(r){setTimeout(r,250);});
              }
              return true;
            }
          }
          return true;
        }
      }catch(e){}
      await new Promise(function(r){setTimeout(r,250);});
    }
    return !!(w.state&&Array.isArray(w.state.clientes));
  }

  async function descargarBackup(manual){
    await esperarDatosCRM();
    var datos=construirDatosBackup();
    var nombre='backup_'+backupFechaISO()+'.json';
    var blob=new Blob([JSON.stringify(datos,null,2)],{type:'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=nombre;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    localStorage.setItem(BACKUP_DAY_KEY,backupFechaISO());
    var w=frame.contentWindow;
    if(w.toast)w.toast(manual?'🛡️ Backup manual descargado ✓':'🛡️ Backup automático descargado ✓','ok');
    return true;
  }

  async function ejecutarBackupAutomatico(){
    if(!backupAutomaticoActivo())return;
    var hoy=backupFechaISO();
    if(localStorage.getItem(BACKUP_DAY_KEY)===hoy)return;
    try{
      await descargarBackup(false);
    }catch(e){
      var w=frame.contentWindow;
      if(w.toast)w.toast('⚠️ No se pudo descargar el backup automático. Puedes usar 🛡️ Backup.','error');
      console.error('Backup automático:',e);
    }
  }

  async function forzarBackupManual(){
    try{
      await descargarBackup(true);
    }catch(e){
      var w=frame.contentWindow;
      if(w.toast)w.toast('⚠️ No se pudo crear el backup: '+String(e&&e.message?e.message:e),'error');
      console.error('Backup manual:',e);
    }
  }

  function instalarAjusteBackup(){
    var w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    if(d.getElementById('ajuste-backup-auto-v308'))return;

    var panel=d.getElementById('panel-ajustes')||d.querySelector('[id*="ajustes"]');
    if(!panel)return;

    var card=d.createElement('div');
    card.id='ajuste-backup-auto-v308';
    card.className='card';
    card.style.marginTop='14px';
    card.innerHTML=
      '<div class="card-title">🛡️ Copia de seguridad</div>'+
      '<div style="font-size:13px;color:var(--text3);line-height:1.5;margin:6px 0 12px">Descarga un JSON completo una vez al día en la carpeta de Descargas del navegador. Tú tienes la última palabra y puedes desconectarlo cuando quieras.</div>'+
      '<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer">'+
        '<span><strong>Backup automático diario</strong><br><span style="font-size:12px;color:var(--text3)">Activo por defecto. El botón 🛡️ Backup sigue disponible aunque lo desactives.</span></span>'+
        '<input id="backup-auto-switch-v308" type="checkbox" style="width:22px;height:22px;flex:0 0 auto">'+
      '</label>';
    panel.appendChild(card);

    var sw=d.getElementById('backup-auto-switch-v308');
    sw.checked=backupAutomaticoActivo();
    sw.onchange=function(){
      localStorage.setItem(BACKUP_AUTO_KEY,sw.checked?'on':'off');
      if(w.toast)w.toast(sw.checked?'🛡️ Backup automático activado ✓':'🛡️ Backup automático desconectado','ok');
    };
  }


  var MENSAJE_COMPARTIR_KEY='franez_mensaje_compartir_pedido_v308';
  var MENSAJE_COMPARTIR_DEFAULT='Te envío este resumen únicamente para que puedas comprobar que el pedido que he pasado es correcto. Si ves cualquier error o algo que no coincida, por favor, házmelo saber. Muchas gracias.';

  function clientePedidoActual(){
    var w=frame.contentWindow;
    if(!w||!w.state||!Array.isArray(w.state.pedidos))return null;
    var p=w.state.pedidos[w.currentOrder||0];
    return p&&w.getClienteById?w.getClienteById(p.clienteId):null;
  }
  function mensajeCompartirActual(){return localStorage.getItem(MENSAJE_COMPARTIR_KEY)||MENSAJE_COMPARTIR_DEFAULT;}
  function normalizarTelefonoV308(v){
    var s=String(v||'').replace(/\D/g,'');
    if(!s)return '';
    if(s.indexOf('0034')===0)s=s.substring(4);
    if(s.indexOf('34')===0&&s.length===11)return s;
    if(s.length===9)return '34'+s;
    return s;
  }
  function construirMensajePedidoV308(){
    var w=frame.contentWindow,p=w.state&&w.state.pedidos?w.state.pedidos[w.currentOrder||0]:null;
    if(!p||!Array.isArray(p.lineas)||!p.lineas.length)return '';
    var lineas=p.lineas.map(function(l){
      var pvp=typeof w.fmNum==='function'?w.fmNum(l.pvp):Number(l.pvp||0).toFixed(2).replace('.',',');
      return '• '+String(l.nombre||'Producto')+' — '+(parseInt(l.uds)||0)+' uds. — PVP '+pvp+' €';
    }).join('\n');
    return mensajeCompartirActual()+'\n\n'+lineas+'\n\nLos precios indicados son PVP.';
  }
  function construirTextoEntregasV308(p){
    if(!p||!p.entregasOverride||!Array.isArray(p.lineas))return '';
    var out=[];
    p.lineas.forEach(function(l,idx){
      var nombre=String(l.nombre||'').toUpperCase(),uds=parseInt(l.uds)||0;
      var aplica=(nombre.indexOf('PHILUS')>-1&&uds>=48)||(nombre.indexOf('PHILUS')===-1&&uds>=12);
      if(!aplica)return;
      var ov=p.entregasOverride['linea_'+idx];if(!ov)return;
      var e1=ov.e1||Math.floor(uds/2),e2=uds-e1;
      out.push('• '+(l.nombre||'Producto')+': '+e1+' uds. — Envío 1: '+(ov.f1||'sin fecha')+' | '+e2+' uds. — Envío 2: '+(ov.f2||'sin fecha'));
    });
    return out.length?'ENTREGAS FRACCIONADAS\n'+out.join('\n'):'';
  }
  function copiarPedidoWhatsAppV308(){
    var texto=construirMensajePedidoV308();if(!texto)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){var w=frame.contentWindow;if(w.toast)w.toast('📋 Pedido copiado. Pégalo en WhatsApp Business.','ok');}).catch(function(){fallbackCopiarV308(texto);});
    }else fallbackCopiarV308(texto);
  }
  function fallbackCopiarV308(texto){
    var d=frame.contentDocument,ta=d.createElement('textarea');ta.value=texto;ta.style.position='fixed';ta.style.opacity='0';d.body.appendChild(ta);ta.select();try{d.execCommand('copy');}catch(e){}ta.remove();var w=frame.contentWindow;if(w.toast)w.toast('📋 Pedido copiado. Pégalo en WhatsApp Business.','ok');
  }
  function abrirWhatsAppPedidoV308(){
    var w=frame.contentWindow,c=clientePedidoActual(),texto=construirMensajePedidoV308();if(!texto)return;
    var telefono=normalizarTelefonoV308(c&&(c.movil||c.telefono));
    if(!telefono){copiarPedidoWhatsAppV308();if(w.toast)w.toast('⚠️ Este cliente no tiene móvil/teléfono. He copiado el pedido para pegarlo manualmente.','error');return;}
    var url='https://wa.me/'+telefono+'?text='+encodeURIComponent(texto);
    window.open(url,'_blank');
  }
  function instalarBotonWhatsApp(){
    var w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||d.getElementById('btn-wa-pedido-v308'))return;
    var pdf=d.querySelector('button[onclick*="compartirNota"]');if(!pdf)return;
    var b=d.createElement('button');b.id='btn-wa-pedido-v308';b.className='btn btn-lg';b.style.cssText='background:#25d366;color:#fff;border:none';b.innerHTML='📱 Compartir pedido por WhatsApp';b.title='Prepara el pedido para el cliente. Tú tendrás que pulsar Enviar.';b.onclick=abrirWhatsAppPedidoV308;pdf.parentNode.insertBefore(b,pdf.nextSibling);
    var c=d.createElement('button');c.id='btn-copy-wa-pedido-v308';c.className='btn btn-ghost btn-sm';c.style.width='100%';c.textContent='📋 Copiar pedido para WhatsApp';c.title='Plan B: copia el mensaje completo al portapapeles.';c.onclick=copiarPedidoWhatsAppV308;b.parentNode.insertBefore(c,b.nextSibling);
  }
  function instalarMensajeCompartir(){
    var w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||d.getElementById('ajuste-mensaje-compartir-v308'))return;
    var panel=d.getElementById('panel-ajustes')||d.querySelector('[id*="ajustes"]');if(!panel)return;
    var card=d.createElement('div');card.id='ajuste-mensaje-compartir-v308';card.className='card';card.style.marginTop='14px';
    card.innerHTML='<div class="card-title">✉️ Mensaje al compartir pedidos</div><div style="font-size:13px;color:var(--text3);line-height:1.5;margin-bottom:10px">Este texto se añadirá al compartir el pedido por email o WhatsApp. Puedes modificarlo cuando quieras.</div><textarea id="mensaje-compartir-v308" style="min-height:120px"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-primary btn-sm" id="guardar-mensaje-compartir-v308">Guardar mensaje</button><button class="btn btn-ghost btn-sm" id="restaurar-mensaje-compartir-v308">Restaurar texto original</button></div>';
    panel.appendChild(card);var ta=d.getElementById('mensaje-compartir-v308');ta.value=mensajeCompartirActual();
    d.getElementById('guardar-mensaje-compartir-v308').onclick=function(){localStorage.setItem(MENSAJE_COMPARTIR_KEY,ta.value.trim()||MENSAJE_COMPARTIR_DEFAULT);if(w.toast)w.toast('✉️ Mensaje guardado ✓','ok');};
    d.getElementById('restaurar-mensaje-compartir-v308').onclick=function(){ta.value=MENSAJE_COMPARTIR_DEFAULT;localStorage.setItem(MENSAJE_COMPARTIR_KEY,MENSAJE_COMPARTIR_DEFAULT);if(w.toast)w.toast('✉️ Mensaje restaurado ✓','ok');};
  }
  function instalarContratoEditable(){
    var w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;var bc=d.getElementById('badge-contrato');if(!bc||bc.dataset.v308)return;bc.dataset.v308='1';bc.style.cursor='pointer';bc.title='Pulsar para modificar la fecha de caducidad del contrato';
    bc.onclick=function(){
      var c=clientePedidoActual();if(!c){if(w.toast)w.toast('Selecciona primero un cliente.','err');return;}var actual=c.contrato||'';
      var html='<div style="padding:16px"><div style="font-size:14px;font-weight:700;margin-bottom:12px">📅 Fecha de caducidad del contrato</div><div style="font-size:12px;color:var(--text3);margin-bottom:8px">Cliente: '+(w.escH?w.escH(c.nombreComercial||c.nombreCompleto||'Cliente'):'Cliente')+'</div><input id="v308-contrato-date" type="date" value="'+String(actual).replace(/[^0-9-]/g,'')+'" style="width:100%;margin-bottom:14px"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" onclick="cerrarMiniModal()">Cancelar</button><button class="btn btn-primary" id="v308-guardar-contrato">Guardar</button></div></div>';
      if(typeof w.mostrarMiniModal==='function'){
        w.mostrarMiniModal(html);setTimeout(function(){var save=d.getElementById('v308-guardar-contrato');if(save)save.onclick=function(){var inp=d.getElementById('v308-contrato-date');c.contrato=inp&&inp.value?inp.value:'';if(typeof w.saveState==='function')w.saveState();if(typeof w.updateClientPreview==='function')w.updateClientPreview();if(typeof w.renderSummary==='function')w.renderSummary();if(typeof w.checkAlerts==='function')w.checkAlerts();if(typeof w.renderAvisosV3==='function')w.renderAvisosV3();if(typeof w.cerrarMiniModal==='function')w.cerrarMiniModal();if(w.toast)w.toast('📅 Fecha de contrato guardada ✓','ok');};},50);
      }else{var nuevo=prompt('Nueva fecha de caducidad (AAAA-MM-DD):',actual);if(nuevo!==null){c.contrato=nuevo;w.saveState();w.updateClientPreview();if(w.renderAvisosV3)w.renderAvisosV3();}}
    };
  }
  function sobrescribirCompartirNota(){
    var w=frame.contentWindow;if(!w||typeof w.verificarPedidoAntesDePDF!=='function'||typeof w.buildPDF!=='function'||typeof w.pdfToBlob!=='function')return;if(w.compartirNota&&w.compartirNota.__v308)return;
